name: Cognitive Continuity Finish

on:
  push:
    paths:
      - '.cognitive-continuity-finish-trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cognitive-memory-social-continuity
          fetch-depth: 0
      - name: Apply continuity patch
        run: python .github/scripts/apply_cognitive_continuity_finish.py
      - name: Commit continuity changes
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No continuity changes"
          else
            git commit -m "fix: centralize explicit memory and social continuity"
            git push origin HEAD:fix/cognitive-memory-social-continuity
          fi
