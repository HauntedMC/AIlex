name: PR47 Final Memory Scope Fix

on:
  push:
    paths:
      - '.pr47-final-memory-scope-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cognitive-memory-social-continuity
          fetch-depth: 0
      - name: Apply final memory-scope fix
        run: python .github/scripts/pr47_final_memory_scope_fix.py
      - name: Commit final memory-scope fix
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No final memory-scope fix required"
          else
            git commit -m "fix: scope episodic memory recall to explicit third-party queries"
            git push origin HEAD:fix/cognitive-memory-social-continuity
          fi
