name: AIlex Edge Runtime Wiring

on:
  push:
    paths:
      - '.ailex-edge-trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ailex-lifelong-social-agent
          fetch-depth: 0
      - name: Apply edge architecture wiring
        run: python .github/scripts/ailex_edge_wire.py
      - name: Commit edge wiring
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java src/main/resources/config.yml
          if git diff --cached --quiet; then
            echo "No runtime wiring changes"
          else
            git commit -m "feat: wire research-edge cognitive architecture"
            git push origin HEAD:feat/ailex-lifelong-social-agent
          fi
