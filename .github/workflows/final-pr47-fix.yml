name: Final PR47 Fix

on:
  push:
    paths:
      - '.final-pr47-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cognitive-memory-social-continuity
          fetch-depth: 0
      - name: Apply final fix
        run: python .github/scripts/final_pr47_fix.py
      - name: Commit final fix
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No final fixes"
          else
            git commit -m "fix: recognize mixed-Dutch live block query"
            git push origin HEAD:fix/cognitive-memory-social-continuity
          fi
