name: AIlex Branch Verification

on:
  push:
    branches:
      - feat/ailex-lifelong-social-agent
    paths:
      - '.ailex-verify-trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate tree
        run: git diff --check
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest
      - name: Tests and coverage
        run: ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification
