name: AIlex Branch Verification

on:
  push:
    branches:
      - feat/ailex-lifelong-social-agent
    paths:
      - '.ailex-verify-trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apply regression fixes
        run: python .github/scripts/ailex_regression_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit regression fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main src/test
          git commit -m "fix: resolve 1.8 cognitive regression suite"
          git push
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest
      - name: Tests and coverage
        run: ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification
