name: Cognitive Memory Orchestration Wiring

on:
  push:
    paths:
      - '.cognitive-memory-orchestration-trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cognitive-memory-social-continuity
          fetch-depth: 0

      - name: Apply cognitive orchestration patch
        run: python .github/scripts/apply_cognitive_memory_orchestration.py

      - name: Commit orchestration changes
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No cognitive orchestration changes"
          else
            git commit -m "fix: integrate memory and event evidence orchestration"
            git push origin HEAD:fix/cognitive-memory-social-continuity
          fi
