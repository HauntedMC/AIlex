name: PR47 Semantic Memory Fix

on:
  push:
    paths:
      - '.pr47-semantic-memory-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cognitive-memory-social-continuity
          fetch-depth: 0
      - name: Apply semantic memory fix
        run: python .github/scripts/pr47_semantic_memory_fix.py
      - name: Commit semantic memory fix
        run: |
          git config user.name "AIlex architecture bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No semantic memory fix required"
          else
            git commit -m "fix: retain episodic memory after semantic recall routing"
            git push origin HEAD:fix/cognitive-memory-social-continuity
          fi
